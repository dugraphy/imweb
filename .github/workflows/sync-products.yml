name: Sync Imweb Products

permissions:
  contents: write

concurrency:
  group: sync-imweb
  cancel-in-progress: false

on:
  workflow_dispatch: {}       # 수동 실행 버튼 + cron-job.org 외부 트리거가 이걸 호출함

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 의존성 설치
        working-directory: tiresearchapp
        run: npm install

      - name: 상품 동기화 스크립트 실행
        working-directory: tiresearchapp
        env:
          IMWEB_CLIENT_ID: ${{ secrets.IMWEB_CLIENT_ID }}
          IMWEB_CLIENT_SECRET: ${{ secrets.IMWEB_CLIENT_SECRET }}
          IMWEB_REFRESH_TOKEN: ${{ secrets.IMWEB_REFRESH_TOKEN }}
          IMWEB_UNIT_CODE: ${{ secrets.IMWEB_UNIT_CODE }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node imweb-sync-products.js

      - name: products.json 변경사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tiresearchapp/products.json
          git diff --staged --quiet || git commit -m "chore: 상품 데이터 자동 동기화"
          git push
