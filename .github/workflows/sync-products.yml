name: Sync Imweb Products

permissions:
  contents: write

on:
  schedule:
    - cron: '0 18 * * *'   # 매일 UTC 18:00 = 한국시간(KST) 새벽 3시 (웹훅 실패 시 대비용 백업)
  workflow_dispatch: {}     # 수동 실행 버튼 활성화
  repository_dispatch:
    types: [imweb-product-changed]   # 웹훅으로부터 실시간 트리거

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 의존성 설치
        working-directory: tiresearchapp
        run: npm install

      - name: 상품 동기화 스크립트 실행
        working-directory: tiresearchapp
        env:
          IMWEB_CLIENT_ID: ${{ secrets.IMWEB_CLIENT_ID }}
          IMWEB_CLIENT_SECRET: ${{ secrets.IMWEB_CLIENT_SECRET }}
          IMWEB_REFRESH_TOKEN: ${{ secrets.IMWEB_REFRESH_TOKEN }}
          IMWEB_UNIT_CODE: ${{ secrets.IMWEB_UNIT_CODE }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node imweb-sync-products.js

      - name: products.json 변경사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tiresearchapp/products.json
          git diff --staged --quiet || git commit -m "chore: 상품 데이터 자동 동기화"
          git push
