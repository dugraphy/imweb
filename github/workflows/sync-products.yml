# ============================================================================
# 매일 자동으로 tiresearchapp/imweb-sync-products.js를 실행해서
# tiresearchapp/products.json을 최신화하고 커밋하는 워크플로우입니다.
#
# ⚠️ 이 파일 자체는 반드시 저장소 최상위의 .github/workflows/ 안에 있어야 합니다.
#    (tiresearchapp 폴더 안에 넣으면 GitHub Actions가 인식하지 못합니다)
# ============================================================================

name: Sync Imweb Products

on:
  schedule:
    - cron: '0 18 * * *'   # 매일 UTC 18:00 = 한국시간(KST) 새벽 3시
  workflow_dispatch: {}     # 수동 실행 버튼 활성화

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 상품 동기화 스크립트 실행
        working-directory: tiresearchapp
        env:
          IMWEB_API_KEY: ${{ secrets.IMWEB_API_KEY }}
          IMWEB_API_SECRET: ${{ secrets.IMWEB_API_SECRET }}
        run: node imweb-sync-products.js

      - name: products.json 변경사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tiresearchapp/products.json
          git diff --staged --quiet || git commit -m "chore: 상품 데이터 자동 동기화"
          git push
